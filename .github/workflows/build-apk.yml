name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle -p android assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AppBlocker.apk
      - run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AppBlocker 최신 버전
          body: AppBlocker.apk를 눌러서 받으세요
          files: AppBlocker.apk
