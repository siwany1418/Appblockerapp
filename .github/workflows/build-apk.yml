name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o AppBlocker_Source.zip -d src
          D=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "APPDIR=$D" >> $GITHUB_ENV
      - name: Fix JVM target
        run: |
          printf '\nandroid {\n  compileOptions {\n    sourceCompatibility = JavaVersion.VERSION_17\n    targetCompatibility = JavaVersion.VERSION_17\n  }\n}\n' >> "$APPDIR/app/build.gradle.kts"
      - name: Fix settings action
        run: |
          sed -i 's/Settings.ACTION_ACCESSIBILITY_DETAILS_SETTINGS/"android.settings.ACCESSIBILITY_DETAILS_SETTINGS"/' "$APPDIR/app/src/main/java/com/example/appblocker/MainActivity.kt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.APPDIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: AppBlocker-apk
          path: ${{ env.APPDIR }}/app/build/outputs/apk/debug/app-debug.apk
