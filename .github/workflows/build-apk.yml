name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          for f in *.zip; do unzip -o "$f" -d src; done
          D=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "APPDIR=$D" >> $GITHUB_ENV
      - name: Fix JVM target
        run: |
          cat >> "$APPDIR/app/build.gradle.kts" <<'EOF'
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.APPDIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: AppBlocker-apk
          path: ${{ env.APPDIR }}/app/build/outputs/apk/debug/app-debug.apk
